description:
  it:
    localisedName: GARI (Gestione Agricola Rurale Informatizzata della Regione Umbria)
    shortDescription: Gestione dati, armonizzare esigenze Ente Pubblico e delle
      aziende agricole, Centri di Assistenza Agricola (CAA), Organismi di
      Controllo
    longDescription: "strumento strategico per il coordinamento e la gestione dei
      dati, degli adempimenti normativi e dei processi amministrativi, fornendo
      una base tecnologica solida e flessibile. È in grado di armonizzare le
      esigenze degli utenti interni dell’Ente Pubblico (amministratori, tecnici,
      responsabili di procedimenti) con quelle di utenti esterni come aziende
      agricole, Centri di Assistenza Agricola (CAA), Organismi di
      Controllo."
    documentation: https://github.com/RegioneUmbria-RCB/GARI-Umbria
    apiDocumentation: https://github.com/RegioneUmbria-RCB/GARI-Umbria
    features:
      - Digitalizzazione e ottimizzazione dei processi agricoli regionali
      - Scalabilità e modularità
      - Interoperabilità
      - Semplificazione dell’accesso
      - Automazione dei procedimenti amministrativi per ridurre i tempi e gli
        errori
      - Accesso semplificato ai dati e alle informazioni utili per aziende
        agricole e CAA
      - Supporto a flussi di lavoro complessi attraverso moduli dedicati (es.
        QDCA, PUA, UMA, ACA)
      - Integrazione con i sistemi informativi nazionali e regionali (es. SPID
        per l’autenticazione, servizi AGEA per fascicoli e piani colturali)
      - Gestione dei dati cartografici attraverso sottosistemi GIS per
        visualizzazioni avanzate e analisi territoriali
      - Fruibilità diretta per gli utenti interni tramite profili configurabili
      - Accesso intuitivo per le aziende agricole e i loro rappresentanti,
        garantendo trasparenza e semplicità nell’interazione con la pubblica
        amministrazione
