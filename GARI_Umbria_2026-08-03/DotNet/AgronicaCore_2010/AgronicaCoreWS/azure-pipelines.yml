name: $(Date:yyyyMMdd).$(Rev:r)

trigger: none

schedules:
  - cron: '30 20 * * *' # cron syntax defining a schedule (21:30)
    displayName: nightly
    branches:
      include: [ develop ] # which branches the schedule applies to

parameters:
  - name: executeDeploy
    displayName: Flag controllo deploy
    type: boolean
    default: true

variables:
- group: Destinations
- template: ../../templates/variables/deploy-path.yml
  parameters:
    branchName: ${{ replace(variables['Build.SourceBranch'], 'refs/heads/', '') }}

extends:
  template: ../../templates/pipelines/net-agro-web-pipeline.yml  # Template reference
  parameters:
    solution: AgronicaCore_2010
    target: AgronicaCoreWS
    artifactName: 'AgronicaCoreWS'
    path: 'AgronicaCore_2010'
    artifactBasePath: AgronicaCoreWS
    outdir: 'AgronicaCoreWS'
    execDeploy: ${{ parameters.executeDeploy }}
    deployPath: $(PathDeployFinal)
    postBuildSteps:
      - task: CopyFiles@2
        displayName: 'Copia dei file GDAL Native non gestiti da Nuget'
        inputs:
          SourceFolder: '$(Build.SourcesDirectory)\AgronicaCore_2010\AgronicaCoreWS\bin\'
          Contents: 'gdal\**'
          TargetFolder: '$(Build.ArtifactStagingDirectory)\AgronicaCoreWS\bin\'