name: $(Date:yyyyMMdd).$(Rev:r)

trigger: none

schedules:
  - cron: '0 7 * * *' # cron syntax defining a schedule (08:00)
    displayName: nightly
    branches:
      include: [ develop ] # which branches the schedule applies to

parameters:
  - name: executeDeploy
    displayName: Flag controllo deploy
    type: boolean
    default: false

variables:
- group: Destinations
- template: ../../templates/variables/deploy-path.yml
  parameters:
    branchName: ${{ replace(variables['Build.SourceBranch'], 'refs/heads/', '') }}

extends:
  template: ../../templates/pipelines/net-agro-web-pipeline.yml  # Template reference
  parameters:
    solution: AgronicaWebService2010
    target: AgronicaWebApiProfilatore
    artifactName: 'AgronicaWebApiProfilatore'
    path: 'AgronicaWebService2010'
    artifactBasePath: AgronicaWebApiProfilatore
    outdir: 'AgronicaWebApiProfilatore'
    sonarExcludeDuplicates: true
    execDeploy: ${{ parameters.executeDeploy }}
    deployPath: $(PathDeployFinal)
    preBuildSteps:
      - template: ../../templates/steps/sonar-pre-build.yml
        parameters:
          scannerMode: 'dotnet'
          projectKey: 'GiasDotNet-WebApiProfilatore'
          projectName: 'GiasDotNet - Web Api Profilatore'
          projectVersion: '$(SonarVersion)'
          #verbose: 'true'
    postBuildSteps:
      - template: ../../templates/steps/sonar-post-build.yml
