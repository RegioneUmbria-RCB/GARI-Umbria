name: $(Date:yyyyMMdd).$(Rev:r)

trigger: none

schedules:
  - cron: '15 21 * * *' # cron syntax defining a schedule (22:15)
    displayName: nightly
    branches:
      include: [ develop ] # which branches the schedule applies to

parameters:
  - name: executeDeploy
    displayName: Flag controllo deploy
    type: boolean
    default: true

variables:
- group: Destinations
- template: ../../templates/variables/deploy-path.yml
  parameters:
    branchName: ${{ replace(variables['Build.SourceBranch'], 'refs/heads/', '') }}

extends:
  template: ../../templates/pipelines/net-agro-web-pipeline.yml  # Template reference
  parameters:
    solution: PianoConcimazione_2008
    target: PianoConcimazione_2017
    artifactName: 'AgronicaPianoConcimazione_2017'
    path: 'PianoConcimazione_2008'
    artifactBasePath: PianoConcimazione_2017
    outdir: 'PianoConcimazione_2017'
    execDeploy: ${{ parameters.executeDeploy }}
    deployPath: $(PathDeployFinal)