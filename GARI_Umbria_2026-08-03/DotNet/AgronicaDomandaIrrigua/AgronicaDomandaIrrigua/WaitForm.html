<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="utf-8">
    <title></title>
    <style type="text/css">
        div#activity_pane {
            background-color: #EEEEEE;
            float: left;
            height: 100%;
            margin: 0;
            opacity: 0.5;
            filter: alpha(opacity = 50);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            left: 0;
            display: none;
        }


        .LoadPanel {
            background-color: #EEEEEE;
            float: left;
            height: 100%;
            margin: 0;
            opacity: 0.5;
            filter: alpha(opacity = 50);
            position: fixed;
            top: 0;
            width: 100%;
            z-index: 1000;
            left: 0;
        }

        .loading-indicator-bars {
            background-image: url('./Styles/images/loading.gif');
            width: 31px;
            height: 31px;
            top: 50%;
            left: 50%;
            position: fixed;
            display: block;
        }
    </style>
</head>
<body>
    <div class="main" id="load_main" style="margin-top: 20px;">
        <div class="LoadPanel">
            <div class="loading-indicator-bars">
            </div>
        </div>
    </div>
</body>
</html>
