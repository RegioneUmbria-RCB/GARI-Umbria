<div class="marker-window">
  <div class="marker-window-row gap-10">
    <button kendoButton *ngIf="isGpsActive === null" class="flex-1 margin-0" themeColor="secondary"
      [title]="'gis.GpsAskPermission' | transloco" gisTooltip>GPS</button>
    <button kendoButton *ngIf="isGpsActive === true" class="flex-1 margin-0" themeColor="success"
      [title]="'gis.GpsHasPermission' | transloco" gisTooltip>GPS</button>
    <button kendoButton *ngIf="isGpsActive === false" class="flex-1 margin-0" themeColor="error"
      [title]="'gis.GpsNoPermission' | transloco" gisTooltip>GPS</button>

    <button kendoButton class="flex-1" fillMode="outline" iconClass="fa fa-map-pin marker-window-btn size-22"
      (click)="addPoint()" [title]="'gis.GpsAddCurrentPoint' | transloco" gisTooltip></button>

    <button kendoButton class="flex-1" fillMode="outline" iconClass="fa fa-check marker-window-btn size-22"
      themeColor="success" (click)="save()" [title]="'Salva' | transloco" gisTooltip></button>

    <button kendoButton class="flex-1" fillMode="outline" iconClass="fa fa-close marker-window-btn size-22"
      themeColor="error" (click)="reset()" [title]="'Annulla' | transloco" gisTooltip></button>
  </div>

  <div class="marker-window-column mh-200">
    <div class="marker-window-row" *ngFor="let marker of markers">
      <div class="flex-1"> {{ marker.marker.id }}.</div>

      <div class="flex-3"> lat: {{ marker.lat }}</div>

      <div class="flex-3"> lng: {{ marker.lng }}</div>

      <button kendoButton class="flex-1" fillMode="flat" iconClass="fa fa-trash marker-window-btn" themeColor="error"
        (click)="removePoint(marker)" [title]="'gis.GpsRemoveCurrentPoint' | transloco" gisTooltip></button>
    </div>

  </div>
</div>
