<div class="marker-window">
  <div class="marker-window-row gap-10">
    <button kendoButton class="flex-1" fillMode="outline" iconClass="fa fa-check marker-window-btn size-22"
      themeColor="success" (click)="save()" [title]="'Salva' | transloco" gisTooltip></button>

    <button kendoButton class="flex-1" fillMode="outline" iconClass="fa fa-close marker-window-btn size-22"
      themeColor="error" (click)="reset()" [title]="'Annulla' | transloco" gisTooltip></button>

    <kendo-dropdownlist class="flex-2" [data]="layers" textField="nome" valueField="id" [(ngModel)]="selectedLayer">
    </kendo-dropdownlist>
  </div>



  <div class="marker-window-column mh-200">
    <div class="marker-window-row" *ngFor="let marker of selectedMarkers">
      <div class="flex-1"> {{ marker.id }}.</div>

      <div class="flex-3"> lat: {{ marker.lat }}</div>

      <div class="flex-3"> lng: {{ marker.lng }}</div>

      <button kendoButton class="flex-1" fillMode="flat" iconClass="fa fa-trash marker-window-btn" themeColor="error"
        (click)="removeSelectedMarker(marker)" [title]="'gis.GpsRemoveCurrentPoint' | transloco" gisTooltip></button>
    </div>

  </div>
</div>
