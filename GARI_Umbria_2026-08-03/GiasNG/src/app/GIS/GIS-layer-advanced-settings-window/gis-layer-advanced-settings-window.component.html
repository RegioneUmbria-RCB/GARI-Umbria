<gis-window *ngIf="windowArgs?.openState" #window [windowArgs]="windowArgs" class="pb-3">

  <div>
    <kendo-grid #grid [kendoGridBinding]="attributesData" [loading]="loading" editable="inline"
      [style.maxHeight.px]="380" (remove)="deleteAttributo($event)" (edit)="editAttributo($event)"
      (cancel)="cancelEditAttributo($event)" (save)="updateAttributo($event)">

      <ng-template kendoGridToolbarTemplate class="row-new-attribute">
        <kendo-textbox #textbox class="textbox" placeholder="{{'gis.NuovoAttributo' | transloco}}" [clearButton]="true"
          (valueChange)="change($event)">
          <ng-template kendoTextBoxPrefixTemplate>
            <span (click)="newAttributeToggle()"
              [class]="saveVisibile ? 'k-icon k-i-floppy k-icon-sm' : 'k-icon k-i-plus-circle k-icon-sm'"></span>
            <kendo-textbox-separator></kendo-textbox-separator>
          </ng-template>
        </kendo-textbox>

        <kendo-dropdownlist *ngIf="false" [data]="featureTypeElements" textField="descrizione" valueField="codice"
          [valuePrimitive]="true" [(ngModel)]="featureTypeSelectedId" [disabled]="isBloccato()"
          (valueChange)="cambioTipoOggetto()">
        </kendo-dropdownlist>
      </ng-template>

      <kendo-grid-column width="10">
        <ng-template kendoGridCellTemplate let-dataItem let-rowIndex="rowIndex">
          <span>{{ rowIndex+1 }}</span>
        </ng-template>
      </kendo-grid-column>

      <kendo-grid-column width="50" field="NomeAttributo" [title]="'Nome' | transloco">
        <ng-template kendoGridCellTemplate let-dataItem let-rowIndex="rowIndex">
          <span>{{ dataItem.NomeAttributo }}</span>
        </ng-template>
      </kendo-grid-column>

      <!--<kendo-grid-column width="50" field="TipoDato" [title]="'TipoDato'">
    </kendo-grid-column>-->

      <kendo-grid-column width="25" field="CampoChiave" [title]="'gis.CampoChiave' | transloco">
        <ng-template kendoGridCellTemplate let-dataItem let-rowIndex="rowIndex">
          <div class="item-switch">
            <label class="toggle">
              <input type="checkbox" class="checkbox" [checked]="dataItem.CampoChiave == '1'"
                (change)="cambioChiaveAttributo(dataItem)" />
            </label>
          </div>
        </ng-template>
      </kendo-grid-column>

      <kendo-grid-column width="25" field="TemaAttivo" [title]="'gis.TemaAttivo' | transloco">
        <ng-template kendoGridCellTemplate let-dataItem let-rowIndex="rowIndex">
          <div class="item-switch">
            <label class="toggle">
              <input type="checkbox" class="checkbox" [checked]="dataItem.TemaAttivo == '1'"
                (change)="cambioAttivitaAttributo(dataItem)" />
            </label>
          </div>
        </ng-template>
      </kendo-grid-column>

      <kendo-grid-column width="25" [title]="'gis.Etichetta' | transloco">
        <ng-template kendoGridCellTemplate let-dataItem let-rowIndex="rowIndex">
          <div class="item-switch">
            <label class="toggle">
              <input type="checkbox" class="checkbox" [checked]="dataItem.EtichettaVisibile"
                (change)="cambioVisibilitaEtichettaAttributo(dataItem)" />
            </label>
          </div>
        </ng-template>
      </kendo-grid-column>

      <kendo-grid-command-column width="30" [title]="'Comandi' | transloco">
        <ng-template kendoGridCellTemplate let-dataItem>
          <button type="button" class="edit-button" kendoGridEditCommand [disabled]="isBloccato()"
            [title]="'Modifica' | transloco" look="bare">
            <i aria-hidden="true" class="fa fa-edit"></i>
          </button>
          <button type="button" class="delete-button" kendoGridRemoveCommand [disabled]="isBloccato()"
            [title]="'Rimuovi' | transloco" look="bare">
            <i aria-hidden="true" class="fa fa-trash"></i>
          </button>
          <button type="button" class="edit-button" kendoGridSaveCommand [disabled]="formGroup?.invalid"
            [title]="'Salva' | transloco" look="bare">
            <i aria-hidden="true" class="fa fa-check"></i>
          </button>
          <button type="button" class="edit-button" kendoGridCancelCommand [title]="'Indietro' | transloco" look="bare">
            <i aria-hidden="true" class="fa fa-times"></i>
          </button>
          <button type="button" class="edit-button" kendoTooltip [title]="'gis.ModificaTraduzioniAttributoLayer' | transloco" look="bare"
            (click)="manageTranslations(dataItem)">
            <i aria-hidden="true" class="xi-label-active"></i>
          </button>
        </ng-template>
      </kendo-grid-command-column>

    </kendo-grid>
  </div>

</gis-window>

<kendo-dialog *ngIf="traduzioniPayload != null" [title]="'gis.ImpostaLaTraduzioneDelNomeDellEtichetta' | transloco"
  [width]="750" (close)="traduzioniPayload = null">

  <gis-translations-grid [translations]="traduzioniPayload.Traduzioni" [loading]="false"
    (updated)="attributeTranslationsUpdated($event)"></gis-translations-grid>
</kendo-dialog>
