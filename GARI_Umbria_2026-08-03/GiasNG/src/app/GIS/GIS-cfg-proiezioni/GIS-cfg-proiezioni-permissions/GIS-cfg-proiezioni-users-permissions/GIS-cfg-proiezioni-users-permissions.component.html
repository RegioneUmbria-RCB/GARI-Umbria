<ng-container *ngIf="savePayload$ | async"></ng-container>

<h5>{{ 'gis.PermessiSuUtenti' | transloco }}</h5>

<kendo-grid [kendoGridBinding]="filteredPermissions$ | async" [loading]="loading" [pageable]="true"
  [pageSize]="pageSize" [sortable]="true" filterable="menu">
  <ng-template kendoGridToolbarTemplate>
    <div gisTooltip class="header">
      <button class="btn btn-primary btn-sm btn-primary-fill btn-important" (click)="isModalOpen = true"
        [title]="'gis.PermessiAggiungiUtente' | transloco" type="button">
        <fa-icon class="xi-draw-add"></fa-icon>
      </button>
    </div>
  </ng-template>

  <kendo-grid-command-column width="50" [title]="'Comandi' | transloco">
    <ng-template kendoGridCellTemplate let-dataItem>
      <button type="button" class="delete-button" kendoGridRemoveCommand size="small" [title]="'Cancella' | transloco"
        look="bare" (click)="delete(dataItem)">
        <fa-icon size="lg" [icon]="faDelete">
        </fa-icon>
      </button>
    </ng-template>
  </kendo-grid-command-column>

  <kendo-grid-column width="150" field="Username" [title]="'gis.PermessiUtente' | transloco">
  </kendo-grid-column>

  <kendo-grid-column width="50" field="Flag_Inserimento" [title]="'gis.PermessiInserimento' | transloco"
    [filterable]="false">
    <ng-template kendoGridCellTemplate let-dataItem let-rowIndex="rowIndex">
      <div class="item-switch">
        <label class="toggle">
          <input type="checkbox" class="checkbox" [(ngModel)]="dataItem.Flag_Inserimento" (change)="update(dataItem)" />
        </label>
      </div>
    </ng-template>
  </kendo-grid-column>

  <kendo-grid-column width="50" field="Flag_Modifica" [title]="'gis.PermessiModifica' | transloco" [filterable]="false">
    <ng-template kendoGridCellTemplate let-dataItem let-rowIndex="rowIndex">
      <div class="item-switch">
        <label class="toggle">
          <input type="checkbox" class="checkbox" [(ngModel)]="dataItem.Flag_Modifica" (change)="update(dataItem)" />
        </label>
      </div>
    </ng-template>
  </kendo-grid-column>

  <kendo-grid-column width="50" field="Flag_Cancellazione" [title]="'gis.PermessiElimina' | transloco"
    [filterable]="false">
    <ng-template kendoGridCellTemplate let-dataItem let-rowIndex="rowIndex">
      <div class="item-switch">
        <label class="toggle">
          <input type="checkbox" class="checkbox" [(ngModel)]="dataItem.Flag_Cancellazione"
            (change)="update(dataItem)" />
        </label>
      </div>
    </ng-template>
  </kendo-grid-column>

  <kendo-grid-column width="50" field="Flag_Informazioni" [title]="'gis.PermessiInformazione' | transloco"
    [filterable]="false">
    <ng-template kendoGridCellTemplate let-dataItem let-rowIndex="rowIndex">
      <div class="item-switch">
        <label class="toggle">
          <input type="checkbox" class="checkbox" [(ngModel)]="dataItem.Flag_Informazioni"
            (change)="update(dataItem)" />
        </label>
      </div>
    </ng-template>
  </kendo-grid-column>

  <kendo-grid-column width="50" field="Flag_Amministrazione" [title]="'gis.PermessiAmministra' | transloco"
    [filterable]="false">
    <ng-template kendoGridCellTemplate let-dataItem let-rowIndex="rowIndex">
      <div class="item-switch">
        <label class="toggle">
          <input type="checkbox" class="checkbox" [(ngModel)]="dataItem.Flag_Amministrazione"
            (click)="updatePermessoAmministra($event, dataItem)" />
        </label>
      </div>
    </ng-template>
  </kendo-grid-column>

  <kendo-grid-column width="50" field="Flag_GestioneInteroLayer" [title]="'gis.PermessiGestioneInteroLayer' | transloco"
    [filterable]="false">
    <ng-template kendoGridCellTemplate let-dataItem let-rowIndex="rowIndex">
      <div class="item-switch">
        <label class="toggle">
          <input type="checkbox" class="checkbox" [(ngModel)]="dataItem.Flag_GestioneInteroLayer"
            (click)="update(dataItem)" />
        </label>
      </div>
    </ng-template>
  </kendo-grid-column>

  <ng-template kendoPagerTemplate let-totalPages="totalPages" let-currentPage="currentPage">
    <kendo-pager-prev-buttons></kendo-pager-prev-buttons>
    <kendo-pager-numeric-buttons [buttonCount]="2"></kendo-pager-numeric-buttons>
    <kendo-pager-next-buttons></kendo-pager-next-buttons>
    <kendo-pager-input></kendo-pager-input>
    <kendo-pager-info></kendo-pager-info>
    <kendo-pager-page-sizes [pageSizes]="[5, 10, 20, 50]"></kendo-pager-page-sizes>
  </ng-template>

</kendo-grid>

<kendo-dialog *ngIf="isModalOpen" class="k-dialog-center" (close)="isModalOpen = false">
  <kendo-dialog-titlebar class="min-width">
    <div class="font-700">{{ 'gis.PermessiAggiungiUtente' | transloco }}</div>
  </kendo-dialog-titlebar>

  <kendo-dropdownlist [(ngModel)]="newUser" [data]="users$ | async" textField="usernameValue" valueField="usernameText"
    [kendoDropDownFilter]="filterSettings">
  </kendo-dropdownlist>

  <kendo-dialog-actions>
    <button kendoButton (click)="isModalOpen = false">{{ 'Annulla' | transloco }}</button>
    <button kendoButton [disabled]="newUser == null" (click)="add()">
      {{ 'Aggiungi' | transloco }}
    </button>
  </kendo-dialog-actions>
</kendo-dialog>
