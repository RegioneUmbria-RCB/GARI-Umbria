<gias-kendo-grid [id]="'RicetteGridConfig'" class="kendo-grid-no-shadows" (selectionChange)="onSelectionChange($event)">
  <ng-container headerContent>
    <span class="separator"></span>
    <div style="display:flex; flex-flow:column;">
      <div style="display:flex; flex-flow:row;">
        <div style="display:flex; align-items: center; margin-right: 10px;">
          <div class="ricettaBloccata legend-spacing"></div>
          <div class="text-spacing">{{ "Bloccata" | transloco }}</div>
          <gias-info-template [title]="'RicettaBloccataInfo' | transloco"></gias-info-template>
        </div>
        <div style="display:flex; align-items: center; margin-right: 10px;">
          <div class="ricettaPubblica legend-spacing"></div>
          <div class="text-spacing">{{ "Pubblica" | transloco }}</div>
          <gias-info-template [title]="'RicettaPubblicaInfo' | transloco"></gias-info-template>
        </div>
        <div style="display:flex; align-items: center;">
          <span class="ricettaSalvataInAgenda legend-spacing"></span>
          <span class="text-spacing">{{ "SalvataInAgenda" | transloco }}</span>
          <gias-info-template [title]="'RicettaInAgendaInfo' | transloco"></gias-info-template>
        </div>
      </div>
    </div>
  </ng-container>

  <ng-container headerContentEnd *ngIf="!store.isMenuAgendaCalledFromGis">

    <ng-container *ngTemplateOutlet="stampeRef;">
    </ng-container>

    <div kendoTooltip *ngIf="permessoEdit">
      <kendo-dropdownbutton
        class="btn btn-primary btnDisabledInModifica  btn-primary-fill"
        [title]="'InviaDatiAPP' | transloco"
        style="margin-right: 5px"
        (itemClick)="onInviaAdApp($event)"
        textField="actionName" [data]='[ { actionName: "InviaDatiAPP", icon: faExport } ]'
      >
        <fa-icon style="color: white;" [icon]="faUpload" aria-hidden="true"></fa-icon>
        <ng-template kendoDropDownButtonItemTemplate let-dataItem>
          <fa-icon style="padding-right: 5px;" size="lg" [icon]="dataItem.icon" aria-hidden="true">
          </fa-icon>
          <span>{{ dataItem.actionName | transloco }}</span>
        </ng-template>
      </kendo-dropdownbutton>
    </div>
      <div kendoTooltip *ngIf="permessoEdit" style="margin-right: 5px">
        <button
          class="btn btn-primary btn-sm"
          (click)="onInviaASmartTractor($event)"
          [type]="'button'"
          [title]="'SendDataToSmartTractor' | transloco"
        >
          <fa-icon size="lg" [icon]="faTractor" aria-hidden="true"></fa-icon>
        </button>
      </div>

    <div kendoTooltip *ngIf="permessoMultiCancellazione">
      <button style="margin-right: 5px" class="btn btn-delete btn-sm" (click)="removeSelected()"
              [type]="'button'"
              [title]="'CancellaleOperazioniSelezionate' | transloco">
        <div class="faGridToolbarIcon faQdCCancellazioneMultipla"></div>
      </button>
    </div>
    <div kendoTooltip *ngIf="permessoEdit">
      <button class="btn btn-primary btn-sm btnDisabledInModifica btn-primary-fill btn-important"
              (click)="onNuovo()"
              [title]="'NuovaRicettaText' | transloco"
              [type]="'button'">
        <fa-icon class="faAddSchedule"></fa-icon>
      </button>
    </div>
  </ng-container>
</gias-kendo-grid>
