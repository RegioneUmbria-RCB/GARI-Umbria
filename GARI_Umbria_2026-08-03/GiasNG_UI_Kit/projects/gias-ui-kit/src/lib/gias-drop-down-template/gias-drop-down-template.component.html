<div *ngIf="(giasFormControlName == undefined || giasFormControlName == null || giasFormControlName == '')">
  <div class="form-group" *ngIf="inputType == 0">
    <div class="input-group">
      <span *ngIf=" name !== '' " class="input-group-addon alert-info" [ngClass]="{'lbl_required' : obligatory}">
        {{name}}
      </span>
      <kendo-dropdownlist #dropdownlist
                          [defaultItem]="defaultItem"
                          [data]="listItems"
                          [itemDisabled]="itemDisabledFn"
                          [textField]="textField"
                          [valueField]="valueField"
                          class="form-control valid"
                          [ngClass]="{'required' : obligatory}"
                          [(ngModel)]="value"
                          [valuePrimitive]="valuePrimitive"
                          (valueChange)="changeValue($event)"
                          [disabled]="isDisabled"
                          [filterable]="filterable"
                          [kendoDropDownFilter]="filterSettings"
                          (open)="openDdl()"
                          [loading]="loading"
                          [virtual]="virtual"
                          (filterChange)="handleFilter($event)">
      </kendo-dropdownlist>
    </div>
  </div>

  <div *ngIf="inputType == 2">
    <kendo-label *ngIf="name != null" [ngClass]="{'lbl_required' : obligatory}">{{name}}</kendo-label>
    <kendo-dropdownlist #dropdownlist
                        [(ngModel)]="value"
                        [defaultItem]="defaultItem"
                        [data]="listItems"
                        [itemDisabled]="itemDisabledFn"
                        [textField]="textField"
                        [valueField]="valueField"
                        style="width: 100%"
                        [ngClass]="{'required' : obligatory}"
                        [valuePrimitive]="valuePrimitive"
                        (valueChange)="changeValue($event)"
                        [filterable]="filterable"
                        [kendoDropDownFilter]="filterSettings"
                        [disabled]="isDisabled"
                        (open)="openDdl()"
                        [loading]="loading"
                        [virtual]="virtual"
                        (filterChange)="handleFilter($event)">
    </kendo-dropdownlist>
  </div>
</div>

<div *ngIf="(giasFormControlName != undefined && giasFormControlName != null && giasFormControlName != '')">
  <div class="form-group" *ngIf="inputType == 0">
    <div class="input-group">
      <span *ngIf="name != undefined && name != null && name != ''" class="input-group-addon alert-info" [ngClass]="{'lbl_required' : obligatory}">
        {{name}}
      </span>
      <kendo-dropdownlist #dropdownlist
                          ngDefaultControl
                          [defaultItem]="defaultItem"
                          [data]="listItems"
                          [itemDisabled]="itemDisabledFn"
                          [textField]="textField"
                          [valueField]="valueField"
                          class="form-control valid"
                          [ngClass]="{'required' : obligatory}"
                          [valuePrimitive]="valuePrimitive"
                          (valueChange)="changeValue($event)"
                          [filterable]="filterable"
                          [kendoDropDownFilter]="filterSettings"
                          [formControlName]="giasFormControlName"
                          (open)="openDdl()"
                          [loading]="loading"
                          [virtual]="virtual"
                          (filterChange)="handleFilter($event)">
      </kendo-dropdownlist>
    </div>
  </div>

  <kendo-formfield *ngIf="inputType == 2">
    <kendo-label *ngIf="name != undefined && name != null && name != ''" [ngClass]="{'lbl_required' : validator}">{{name}}</kendo-label>
    <kendo-label class="lbl_required" *ngIf="validator"> *</kendo-label>
    <kendo-dropdownlist #dropdownlist
                        ngDefaultControl
                        [defaultItem]="defaultItem"
                        [data]="listItems"
                        [itemDisabled]="itemDisabledFn"
                        [textField]="textField"
                        [valueField]="valueField"
                        style="width: 100%"
                        [ngClass]="{'required' : obligatory}"
                        [valuePrimitive]="valuePrimitive"
                        (valueChange)="changeValue($event)"
                        [filterable]="filterable"
                        [kendoDropDownFilter]="filterSettings"
                        [formControlName]="giasFormControlName"
                        (open)="openDdl()"
                        (blur)="onBlur()"
                        [loading]="loading"
                        [virtual]="virtual"
                        (filterChange)="handleFilter($event)">
    </kendo-dropdownlist>
  </kendo-formfield>
</div>
