<div *ngIf="(giasFormControlName == undefined || giasFormControlName == null || giasFormControlName == '')">
    <div class="form-group" *ngIf="inputType == 0">
        <div class="input-group">
      <span *ngIf=" name !== '' " class="input-group-addon alert-info" [ngClass]="{'lbl_required' : obligatory}">
        {{name}}
      </span>
            <kendo-dropdownlist #dropdownlist [defaultItem]="defaultItem"
                                [data]="listItems"
                                [textField]="textField"
                                [valueField]="valueField"
                                class="form-control valid"
                                [ngClass]="{'required' : obligatory}"
                                [(ngModel)]="value"
                                [valuePrimitive]="true"
                                (valueChange)="changeValue($event)"
                                (open)="openDdl()"
                                [disabled]="isDisabled"
                                [filterable]="filterable"
                                [kendoDropDownFilter]="filterSettings"
                                [loading]="loading"
                                (filterChange)="handleFilter($event)"
                                [virtual]="virtual"
                                [popupSettings]="popupSettings">
            </kendo-dropdownlist>
        </div>
    </div>
    <div *ngIf="inputType == 2">
        <kendo-label>{{name}}</kendo-label>
        <kendo-dropdownlist #dropdownlist
                            [defaultItem]="defaultItem"
                            [data]="listItems"
                            [textField]="textField"
                            [valueField]="valueField"
                            class="form-control valid"
                            [ngClass]="{'required' : obligatory}"
                            [(ngModel)]="value"
                            [valuePrimitive]="true"
                            (valueChange)="changeValue($event)"
                            (open)="openDdl()"
                            [disabled]="isDisabled"
                            [filterable]="filterable"
                            [kendoDropDownFilter]="filterSettings"
                            [loading]="loading"
                            (filterChange)="handleFilter($event)"
                            [virtual]="virtual"
                            [popupSettings]="popupSettings">
        </kendo-dropdownlist>
    </div>
</div>
<div *ngIf="(giasFormControlName != undefined && giasFormControlName != null && giasFormControlName != '')">
    <div class="form-group" *ngIf="inputType == 0">
        <div class="input-group">
      <span *ngIf="name != undefined && name != null && name != ''" class="input-group-addon alert-info"
            [ngClass]="{'lbl_required' : obligatory}">
        {{name}}
      </span>
            <kendo-dropdownlist #dropdownlist ngDefaultControl
                                [defaultItem]="defaultItem"
                                [data]="listItems"
                                [textField]="textField"
                                [valueField]="valueField"
                                class="form-control valid"
                                [ngClass]="{'required' : obligatory}"
                                [valuePrimitive]="true"
                                (valueChange)="changeValue($event)"
                                (open)="openDdl()"
                                [filterable]="filterable"
                                [kendoDropDownFilter]="filterSettings"
                                [formControlName]="giasFormControlName"
                                [loading]="loading"
                                (filterChange)="handleFilter($event)"
                                [virtual]="virtual"
                                [popupSettings]="popupSettings"
                                [required]="isRequired">
            </kendo-dropdownlist>
        </div>
    </div>
    <kendo-formfield *ngIf="inputType == 2">
        <kendo-label *ngIf="name != undefined && name != null && name != ''"
                     [ngClass]="{'lbl_required' : validator}">
        
                    <gias-info-template *ngIf="hasInfo" size="lg"
                                [title]="infoTitle | transloco"></gias-info-template>
                        {{name}}
        </kendo-label>
        <kendo-label class="lbl_required" *ngIf="validator && showStar"> *</kendo-label>



        <kendo-dropdownlist #dropdownlist ngDefaultControl
                            [defaultItem]="defaultItem"
                            [data]="listItems"
                            [textField]="textField"
                            [valueField]="valueField"
                            style="width: 100%"
                            [ngClass]="{'required' : obligatory}"
                            [valuePrimitive]="valuePrimitive"
                            (valueChange)="changeValue($event)"
                            (open)="openDdl()"
                            [filterable]="filterable" [kendoDropDownFilter]="filterSettings"
                            [formControlName]="getCtrlName()"
                            [loading]="loading"
                            (blur)="onBlur()"
                            (filterChange)="handleFilter($event)"
                            [virtual]="virtual"
                            [popupSettings]="popupSettings"
                            [required]="isRequired">
        </kendo-dropdownlist>
    </kendo-formfield>
</div>
