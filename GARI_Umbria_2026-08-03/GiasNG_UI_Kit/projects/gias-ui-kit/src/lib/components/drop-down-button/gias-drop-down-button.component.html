<kendo-dropdownbutton
  #dropDownButton
  [buttonClass]="buttonClass"
  [data]="data"
  [disabled]="disabled"
  [fillMode]="fillMode"
  [icon]="icon"
  [iconClass]="iconClass"
  [imageUrl]="imageUrl"
  [popupSettings]="popupSettings"
  [rounded]="rounded"
  [size]="size"
  [tabIndex]="tabIndex"
  [textField]="textField"
  [themeColor]="themeColor"
>
  <fa-icon class="btn increase-border btn-outline btn-sm" size="lg" [icon]="iconDefinition"></fa-icon>
</kendo-dropdownbutton>
