<div *ngIf="(giasFormControlName == undefined || giasFormControlName == null || giasFormControlName == '')">
    <div *ngIf="inputType == 0">
      <div class="form-group">
        <div class="input-group">
          <span *ngIf=" name !== '' " class="input-group-addon alert-info" [ngClass]="{'lbl_required' : obligatory}">
            {{ name  }}
          </span>
        <kendo-datetimepicker
            #datetimepicker
            (valueChange)="onChange($event)"
            [format]="format"
            placeholder=""
            (focus)="handleFocus()"
            (blur)="handleBlur()"
            (close)="onClose()"
            (open)="onOpen()"
            [(ngModel)]="value"
            [fillMode]="'flat'"
            [min]="startValue"
            [max]="endValue">
        </kendo-datetimepicker>
        </div>
      </div>
    </div>
    <div *ngIf="inputType == 2">
      <div class="row">
        <kendo-label [ngClass]="{'lbl_required' : obligatory}">{{name}}</kendo-label>
      </div>
      <div class="row">
        <kendo-datetimepicker #datetimepicker placeholder=""
                          [name]="name"
                          (focus)="handleFocus()"
                          (blur)="handleBlur()"
                          (valueChange)="onChange($event)"
                          (close)="onClose()"
                          (open)="onOpen()"
                          [format]="format"
                          [(ngModel)]="value"
                          [fillMode]="'flat'"
                          [min]="startValue"
                          [max]="endValue">
        </kendo-datetimepicker>
      </div>
    </div>
  </div>
  <div *ngIf="(giasFormControlName != undefined && giasFormControlName != null && giasFormControlName != '')">
    <div *ngIf="inputType == 0">
      <div class="form-group">
        <div class="input-group">
          <span *ngIf=" name !== '' " class="input-group-addon alert-info" [ngClass]="{'lbl_required' : obligatory}">
            {{name}}
          </span>
          <kendo-datetimepicker #datetimepicker
                placeholder=""
                (focus)="handleFocus()"
                (blur)="handleBlur()"
                (valueChange)="onChange($event)"
                (close)="onClose()"
                (open)="onOpen()"
                [format]="format"
                [formControlName]="giasFormControlName"
                [fillMode]="'flat'"
                [min]="startValue"
                [max]="endValue">
          </kendo-datetimepicker>
        </div>
      </div>
    </div>
    <div *ngIf="inputType == 2">
      <kendo-label [ngClass]="{'lbl_required' : validator}" *ngIf="name != null">{{name}}</kendo-label>
      <kendo-label class="lbl_required" *ngIf="validator"> *</kendo-label>
        <kendo-datetimepicker #datetimepicker
              [readOnlyInput]="readOnlyInput"
              (valueChange)="onChange($event)"
              style="width: 100%"
              [format]="format"
              placeholder=""
              (focus)="handleFocus()"
              (blur)="handleBlur()"
              (close)="onClose()"
              (open)="onOpen()"
              [formControlName]="giasFormControlName"
              [min]="startValue"
              [disabledDatesValidation]="disabledDatesValidation"
              [disabledDates]="disabledDates"
              [max]="endValue">
        </kendo-datetimepicker>
    </div>
  </div>
